[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch2casadi"
version = "0.1.1"
description = "Export PyTorch models and derivative ONNX graphs for CasADi optimization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CasADi contributors"}]
keywords = ["pytorch", "casadi", "onnx", "optimization", "automatic-differentiation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/casadi/torch2casadi"
Repository = "https://github.com/casadi/torch2casadi"
Issues = "https://github.com/casadi/torch2casadi/issues"
Changelog = "https://github.com/casadi/torch2casadi/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
