name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: Build sdist and wheel from sdist
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Ensure installing the wheel will not manage runtime dependencies
        run: |
          python - <<'PYCODE'
          import email, pathlib, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
              message = email.message_from_bytes(archive.read(metadata))
          if message.get_all('Requires-Dist'):
              raise SystemExit('Runtime dependencies must remain user-managed')
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Install CPU PyTorch and the built wheel
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test the installed package
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
