name: Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index (run this workflow from a version tag)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Require a tag matching package metadata
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PYCODE'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          expected = 'refs/tags/v' + version
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit('Run this workflow from ' + expected)
          PYCODE
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
  provenance:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Attest the tested distribution artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
  publish:
    needs: provenance
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/torch2casadi' || 'https://test.pypi.org/p/torch2casadi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish with OIDC and PyPI attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          attestations: true
