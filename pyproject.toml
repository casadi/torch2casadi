[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch2casadi"
version = "0.1.0.dev0"
description = "Export PyTorch models and derivative ONNX graphs for CasADi optimization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CasADi contributors"}]
keywords = ["pytorch", "casadi", "onnx", "optimization", "automatic-differentiation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["torch>=2.6,<2.7", "onnx==1.17.0", "onnxscript==0.2.7", "protobuf>=5.29.5,<6", "onnxruntime>=1.20,<2", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/casadi/torch2casadi"
Repository = "https://github.com/casadi/torch2casadi"
Issues = "https://github.com/casadi/torch2casadi/issues"
Changelog = "https://github.com/casadi/torch2casadi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]
